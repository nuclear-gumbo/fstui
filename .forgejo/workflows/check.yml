#
# The full checks on the maintainer's own hardware: formatting, vet,
# staticcheck, golangci-lint, govulncheck, race tests and every build
# variant (make check), in the pinned Nix toolchain used for development.
# GitHub runs a lighter check for public pull requests (.github/workflows).

name: check

on:
  push:
  pull_request:

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  # Fetched by ref, not by SHA: fetching an arbitrary SHA depends on server
  # settings, a named ref works everywhere.
  # FSTUI_SRC_URL points the fetch at another clone, for a run outside the
  # server (forgejo-runner exec); on the server it is unset.
  SRC_URL: ${{ vars.FSTUI_SRC_URL || format('{0}/{1}', github.server_url, github.repository) }}
  SRC_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  gates:
    runs-on: fstui-containers
    container:
      image: docker.io/nixos/nix:2.35.4@sha256:05fe61395588e8a11452e9ba4602d4f0eb0ce5db8f7b9fa417c4ec07af79ca42
      # The runner keeps the Nix store in this volume between runs, seeded
      # from this image's /nix.
      volumes:
        - fstui-nix:/nix
    steps:
      # A plain fetch instead of actions/checkout: no third-party code to trust.
      - name: Fetch source
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth=1 "$SRC_URL" "$SRC_REF"
          git checkout -q FETCH_HEAD
      - name: make check
        run: nix develop .#ci -c make check
