#
# Build with Debian's Go from trixie-backports and with Gentoo's Go under the
# environment go-env.eclass and go-module.eclass set. The modules are
# vendored first, as the release archive carries them, and the build then
# runs offline. Runs on the CI host's rootless Podman runner (label
# fstui-containers).

name: distro

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # FSTUI_SRC_URL points the fetch at another clone, for a run outside the
  # server (forgejo-runner exec); on the server it is unset.
  SRC_URL: ${{ vars.FSTUI_SRC_URL || format('{0}/{1}', github.server_url, github.repository) }}
  SRC_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
  GOTOOLCHAIN: local

jobs:
  debian:
    runs-on: fstui-containers
    container:
      image: docker.io/library/debian:trixie@sha256:bfc36aecdece0387418759dba474aa856c026ca8087da3606b41b90ab0509c99
    steps:
      # trixie main ships Go 1.24; go.mod requires 1.27, available in backports.
      - name: Install toolchain
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' >/etc/apt/sources.list.d/backports.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends -t trixie-backports golang-go >/dev/null
          apt-get install -y -qq --no-install-recommends git make ca-certificates >/dev/null
          go version
      - name: Fetch source
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth=1 "$SRC_URL" "$SRC_REF"
          git checkout -q FETCH_HEAD
      # The release archive vendors the modules (go mod vendor); the build
      # below then runs offline, as a distribution builds it.
      - name: Vendor the modules
        run: go mod vendor
      - name: Build and test offline
        env:
          GOPROXY: "off"
          GOFLAGS: -mod=vendor
        run: |
          make build VERSION=ci-debian
          ./bin/fstui --version
          go test ./...

  gentoo:
    runs-on: fstui-containers
    container:
      image: docker.io/gentoo/stage3@sha256:549add81947a81b68f8ff83d78c0e5a6e876da429567aa0c6a32fc24d37ae578
    steps:
      - name: Install toolchain from Gentoo binary packages
        run: |
          emerge-webrsync -q
          emerge --quiet --oneshot --getbinpkg dev-lang/go dev-vcs/git
          go version
      - name: Fetch source
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth=1 "$SRC_URL" "$SRC_REF"
          git checkout -q FETCH_HEAD
      # The release archive vendors the modules (go mod vendor); the build
      # below then runs offline, as a distribution builds it.
      - name: Vendor the modules
        run: go mod vendor
      # GOFLAGS as set by go-env.eclass on amd64, minus -x -v which only add
      # log output. -buildmode=pie with CGO_ENABLED=0 must keep linking.
      - name: Build and test offline as Portage would
        env:
          GOPROXY: "off"
          GOFLAGS: -mod=vendor -modcacherw -buildvcs=false -buildmode=pie
        run: |
          make build VERSION=ci-gentoo
          ./bin/fstui --version
          go test ./...
