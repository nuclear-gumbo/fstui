dir: local
	path /var/lib/vz
	content iso,backup,vztmpl,import

zfspool: local-zfs
	pool rpool/data
	content rootdir,images
	nodes pve1,pve2,store1
	sparse 1

zfspool: pbs
	pool pbspool
	content rootdir,images
	nodes store1
	sparse 1

pbs: PBS
	datastore backup
	server 192.0.2.9
	content backup
	fingerprint 00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff
	namespace Backup
	prune-backups keep-all=1
	username backup@pbs

pbs: offsite
	datastore offsite
	server 192.0.2.9
	content backup
	fingerprint 00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff
	namespace Backup
	prune-backups keep-all=1
	username backup@pbs

zfspool: mediapool
	pool mediapool
	content images,rootdir
	mountpoint /mediapool
	nodes store1
	sparse 0

zfspool: nvmepool
	pool nvmepool
	content rootdir,images
	mountpoint /nvmepool
	nodes store1
	sparse 0

dir: scratch_2
	path /mnt/scratch_2
	content import,rootdir,backup,iso,vztmpl,images,snippets
	nodes store1
	prune-backups keep-all=1
	shared 0

nfs: iso
	export /nvmepool/isos
	path /mnt/pve/iso
	server 192.0.2.10
	content iso,vztmpl
	options vers=4.2
	prune-backups keep-all=1

zfspool: vmpool
	pool vmpool
	content images,rootdir
	mountpoint /vmpool
	nodes pve4
	sparse 1

zfspool: backup8
	pool backup8
	content rootdir,images
	nodes pve4
	sparse 1

zfspool: tank-pbs
	pool tank/pbs
	blocksize 64k
	content images
	mountpoint /tank/pbs
	nodes pve4
	sparse 1

